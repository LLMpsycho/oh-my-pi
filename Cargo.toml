[workspace]
# Explicit, not `crates/pi-*`: a glob member that resolves to a directory
# without a Cargo.toml (a deleted crate whose dir survives `git reset --hard`
# because an ignored file stayed behind) is a hard error that fails the whole
# workspace, not a skipped entry.
members = [
   "crates/pi-ast",
   "crates/pi-builtins",
   "crates/pi-iso",
   "crates/pi-natives",
   "crates/pi-shell",
   "crates/pi-vcs",
   "crates/pi-voice",
   "crates/pi-walker",
   "crates/vendor/brush-core",
]
resolver = "3"

[workspace.package]
version = "18.0.11"
edition = "2024"
license = "MIT"
authors = ["Stencil Labs, Inc."]
homepage = "https://omp.sh/"
repository = "https://github.com/can1357/oh-my-pi"
